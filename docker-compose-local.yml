services:
  bot:
    build: .
    container_name: addislaptop-bot-local
    env_file: .env
    command: python -m bot.core
    volumes:
      - ./data:/app/data
      - ./laptop_scraper_session.session:/app/laptop_scraper_session.session

  user-ui:
    build: .
    container_name: addislaptop-user-local
    env_file: .env
    command: streamlit run web/user.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    expose:
      - "8501"
    volumes:
      - ./data:/app/data

  admin-ui:
    build: .
    container_name: addislaptop-admin-local
    env_file: .env
    command: streamlit run web/admin.py --server.port=8502 --server.address=0.0.0.0 --server.headless=true
    expose:
      - "8502"
    volumes:
      - ./data:/app/data

  caddy:
    image: caddy:2-alpine
    container_name: addislaptop-caddy-local
    ports:
      - "8501:8501"
      - "8502:8502"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile