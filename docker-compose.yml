services:
  bot:
    build: .
    container_name: addislaptop-bot
    restart: always
    env_file: .env
    command: python -m bot.core
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./laptop_scraper_session.session:/app/laptop_scraper_session.session

  user-ui:
    build: .
    container_name: addislaptop-user
    restart: always
    env_file: .env
    command: streamlit run web/user.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    expose:
      - "8501"
    volumes:
      - ./data:/app/data

  admin-ui:
    build: .
    container_name: addislaptop-admin
    restart: always
    env_file: .env
    command: streamlit run web/admin.py --server.port=8502 --server.address=0.0.0.0 --server.headless=true
    expose:
      - "8502"
    volumes:
      - ./data:/app/data

  caddy:
    image: caddy:2-alpine
    container_name: addislaptop-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: